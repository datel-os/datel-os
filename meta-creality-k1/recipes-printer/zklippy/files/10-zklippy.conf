# klipper.service runs the Klipper host chosen in /usr/data/k1os/klipper-host,
# zklippy unless it says kalico (k1os-klipper-host).
[Service]
ExecStart=
ExecStart=/usr/libexec/k1os/klipper-host
# Real time above every other process, below the kernel's interrupt threads
# (50): zklippy ran so in all its tests on the printer, and Kalico waited 5 ms
# instead of 1.2 s a minute for a CPU so (16 November 2026). No
# ResetOnFork: the host's own threads keep it.
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=20
