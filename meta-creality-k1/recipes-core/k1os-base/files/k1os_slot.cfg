# Datel OS: the boot slot from Mainsail's console. The work happens in
# Moonraker's k1os_slot component, which runs k1os-slot.
# Included from k1os_kalico.cfg as [include /usr/share/k1os/slot.cfg].
#
#   SLOT_STATUS   which system runs and which one the next power-up starts
#   SLOT_KEEP     keep the running system: without it, turning the printer
#                 off and on returns to the system that ran before

[gcode_macro SLOT_STATUS]
description: Datel OS: which system runs and which one starts next
gcode:
    {action_call_remote_method("k1os_slot_status")}

[gcode_macro SLOT_KEEP]
description: Datel OS: keep the running system after its trial boot
gcode:
    {action_call_remote_method("k1os_slot_keep")}
