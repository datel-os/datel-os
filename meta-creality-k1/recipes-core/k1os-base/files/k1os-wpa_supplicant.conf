# Datel OS's own settings for wpa_supplicant. k1os-wifi.service reads this file
# after the user's /usr/data/k1os/wpa_supplicant.conf, and a network block
# there may still carry a bgscan line of its own (bgscan="" switches it off).
#
# Look for a better access point of the same network: every 5 minutes if the
# one the printer connected to is weaker than -65 dBm, once a day otherwise.
# Without this the printer stays for good with the access point it happened
# to get, for instance the far one because the near one refused it once or
# was still starting after a power cut. A scan delays traffic six times
# within a second, by less than 0.1 s each time, and loses none of it.
bgscan="simple:300:-65:86400"

# No Wi-Fi Direct. wpa_supplicant would create a P2P device beside wlan0 that
# the printer has no use for, and brcmfmac warns in the kernel log at about
# every tenth removal of it, which is at every tenth stop of wpa_supplicant.
p2p_disabled=1
