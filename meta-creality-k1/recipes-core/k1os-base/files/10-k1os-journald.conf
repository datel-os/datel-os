# Datel OS settings for systemd-journald. They override poky's
# /usr/lib/systemd/journald.conf.d/00-systemd-conf.conf (ForwardToSyslog=yes,
# RuntimeMaxUse=64M): drop-ins are read in the order of their names, and the
# last value read wins.
[Journal]
# BusyBox syslogd does not read the socket the journal forwards to, so every
# burst only produced "Forwarding to syslog missed N messages". The journal is
# the log; k1os-logstream sends it off the printer.
ForwardToSyslog=no
# The journal lives in /run, a tmpfs of 20 % of the RAM (42 MiB), and every
# byte of it is RAM. poky's 64M is more than all of /run, so only journald's
# default keep-free of 5 % (2 MiB) bounded it: after a day and a half it held
# 36 MiB, and systemctl daemon-reload refused to run, as systemd wants 16 MiB
# free on /run for a reload. With at most 16 MiB of journal (in files of
# 2 MiB, an eighth of it) about 25 MiB of /run stay free. 16 MiB hold at
# least 14 hours of the journal (measured with prints on 16 November 2026);
# the log server keeps the rest.
RuntimeMaxUse=16M
