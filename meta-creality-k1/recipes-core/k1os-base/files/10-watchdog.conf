# The X2000's hardware watchdog resets the SoC when PID 1 stops pinging it,
# so a hung system comes back by itself instead of sitting dead mid-print.
# Ten seconds before that the watchdog's pre-timeout panics the kernel, so
# that what the system was doing is in the kernel log kept over the restart
# (/sys/fs/pstore). Upstream's watchdog driver leaves the pre-timeout to be
# set from here; the SDK's driver had it built in.
[Manager]
RuntimeWatchdogSec=30s
RuntimeWatchdogPreSec=10s
RebootWatchdogSec=2min
