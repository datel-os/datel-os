# The Wi-Fi chip's firmware does not move the printer between access points
# on its own: its roaming engine scans the other channels whenever it likes,
# which costs transmissions while the camera streams. The kernel leaves the
# driver's default alone (zales/k1-linux pull request 15), so the image
# switches the engine off here. wpa_supplicant looks for a better access
# point instead, and seldom (/etc/k1os/wpa_supplicant.conf).
options brcmfmac roamoff=1
